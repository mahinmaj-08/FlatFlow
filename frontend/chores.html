<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chores – FlatFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a class="brand" href="dashboard.html">FlatFlow</a><a href="dashboard.html">Dashboard</a><a href="chores.html" aria-current="page">Chores</a><a href="expenses.html">Expenses</a><a href="household.html">Household</a><a href="index.html" id="logout-link">Log out</a></nav>
<main>
<h1>Chores</h1>
<p class="sub">Add a chore in under a minute.</p>
<form class="card" id="chore-form"><h2>Add a chore</h2>
<label for="chore_title">Title</label><input id="chore_title" name="chore_title" type="text" required>
<label for="chore_description">Description</label><textarea id="chore_description" name="chore_description"></textarea>
<label for="chore_assignee">Assign to</label><select id="chore_assignee" name="chore_assignee" required><option value="">Choose a member</option></select>
<label for="chore_due_date">Due date</label><input id="chore_due_date" name="chore_due_date" type="date" required>
<label for="chore_status">Status</label><select id="chore_status" name="chore_status"><option value="PENDING">Pending</option><option value="DONE">Done</option></select>
<button type="submit">Add chore</button>
<p class="msg" id="form-message" role="alert"></p></form>
<section class="card"><h2>All chores</h2>
<div class="filters">
<div><label for="filter_assignee">Assigned to</label><select id="filter_assignee"><option value="">Everyone</option></select></div>
<div><label for="filter_status">Show</label><select id="filter_status"><option value="">All chores</option><option value="OVERDUE">Overdue only</option><option value="PENDING">Pending only</option><option value="DONE">Done only</option></select></div>
</div>
<div class="table-wrap"><table><thead><tr><th>Chore</th><th>Assigned to</th><th>Due</th><th>Status</th></tr></thead>
<tbody id="chore-list"><tr><td class="empty" colspan="4">No chores match these filters.</td></tr></tbody></table></div></section>
</main>
<script src="js/api.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/chores.js" defer></script>
</body>
</html>
