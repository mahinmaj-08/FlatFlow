<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – FlatFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a class="brand" href="index.html">FlatFlow</a></nav>
<main class="narrow">
<h1>Welcome back</h1>
<p class="sub">Log in to see your household.</p>
<form class="card" id="login-form">
<label for="login_name">Login name</label><input id="login_name" name="login_name" type="text" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
<p class="msg" id="form-message" role="alert"></p>
</form>
<p>New here? <a href="register.html">Create an account</a></p>
</main>
<script src="js/api.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/login.js" defer></script>
</body>
</html>
